<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot da Loja</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
    }

    #chat {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 15px;
        min-height: 300px;
        margin-bottom: 15px;
    }

    input {
        width: 70%;
        padding: 10px;
        box-sizing: border-box;
    }

    button {
        padding: 10px 20px;
        cursor: pointer;
    }
</style>
</head>
<body>

    <h1>Chatbot da Loja</h1>

    <div id="chat"></div>

    <label for="message">Mensagem</label>
<input type="text" id="message" placeholder="Digite sua pergunta...">
    <button id="send">Enviar</button>

    <script>
    const messageInput = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const chat = document.getElementById("chat");

    sendButton.addEventListener("click", async () => {
        const message = messageInput.value.trim();

        if (!message) {
            return;
        }

        chat.innerHTML += `<p><strong>Você:</strong> ${message}</p>`;

        const response = await fetch("http://127.0.0.1:8000/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        chat.innerHTML += `<p><strong>Bot:</strong> ${data.response}</p>`;

        messageInput.value = "";
    });
</script>

</body>
</html>
